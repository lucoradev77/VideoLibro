name: Build & Release VideoLibro Studio

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12 and dependencies
        run: uv sync --locked --python 3.12
      - name: Build Windows executable
        run: >-
          uv run pyinstaller --noconfirm --clean --onefile --windowed
          --name VideoLibroStudio --icon assets/videolibro.ico
          --add-data "assets;assets" --collect-all imageio_ffmpeg
          --collect-all edge_tts --hidden-import pyttsx3.drivers
          --hidden-import pyttsx3.drivers.sapi5 main.py
      - name: Rename release asset
        run: Copy-Item dist\VideoLibroStudio.exe dist\VideoLibroStudio-Windows-x64.exe
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoLibroStudio-Windows-x64
          path: dist/VideoLibroStudio-Windows-x64.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Linux runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libgl1 espeak-ng
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12 and dependencies
        run: uv sync --locked --python 3.12
      - name: Build Linux executable
        run: >-
          uv run pyinstaller --noconfirm --clean --onefile --windowed
          --name VideoLibroStudio --add-data "assets:assets"
          --collect-all imageio_ffmpeg --collect-all edge_tts
          --hidden-import pyttsx3.drivers main.py
      - name: Package Linux release
        run: tar -czf dist/VideoLibroStudio-Linux-x86_64.tar.gz -C dist VideoLibroStudio
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoLibroStudio-Linux-x86_64
          path: dist/VideoLibroStudio-Linux-x86_64.tar.gz

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12 and dependencies
        run: uv sync --locked --python 3.12
      - name: Build macOS Apple Silicon app
        run: >-
          uv run pyinstaller --noconfirm --clean --windowed
          --name VideoLibroStudio --add-data "assets:assets"
          --collect-all imageio_ffmpeg --collect-all edge_tts
          --hidden-import pyttsx3.drivers main.py
      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent dist/VideoLibroStudio.app dist/VideoLibroStudio-macOS-AppleSilicon.zip
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoLibroStudio-macOS-AppleSilicon
          path: dist/VideoLibroStudio-macOS-AppleSilicon.zip

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
