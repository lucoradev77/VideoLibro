name: Build & Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12 & dependencies
        run: |
          uv sync
          uv add --dev pyinstaller

      - name: Build VideoLibroStudio.exe
        run: |
          uv run pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "VideoLibroStudio" `
            --icon "assets/videolibro.ico" `
            --add-data "assets;assets" `
            --collect-all imageio_ffmpeg `
            --collect-all edge_tts `
            --hidden-import pyttsx3.drivers `
            --hidden-import pyttsx3.drivers.sapi5 `
            main.py

      - name: Rename artifact for Release
        run: |
          Copy-Item "dist\VideoLibroStudio.exe" "dist\VideoLibroStudio-Windows-x64.exe"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoLibroStudio-Windows-x64
          path: dist/VideoLibroStudio-Windows-x64.exe

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VideoLibroStudio-Windows-x64.exe
          generate_release_notes: true
