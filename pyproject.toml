[project]
name = "videolibro"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Luca Corallo", email = "lucoradev@outlook.it" }
]
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.3.1",
    "imageio-ffmpeg>=0.8.1",
    "pillow>=13.0.0",
    "pyside6>=6.12.0",
    "python-docx>=1.2.0",
    "pyttsx3>=2.99",
]

[project.scripts]
videolibro = "videolibro:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
