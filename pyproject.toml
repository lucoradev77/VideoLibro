[project]
name = "videolibro"
version = "0.1.2"
description = "Add your description here"
authors = [
    { name = "Luca Corallo", email = "lucoradev@outlook.it" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "edge-tts>=7.3.1",
    "httpx>=0.27.0",
    "imageio-ffmpeg>=0.8.1",
    "kokoro-onnx>=0.4.8",
    "numpy>=1.26.0",
    "onnxruntime>=1.19.0",
    "pillow>=13.0.0",
    "pyside6>=6.12.0",
    "python-docx>=1.2.0",
    "pyttsx3>=2.99",
]

[project.scripts]
videolibro = "videolibro:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
